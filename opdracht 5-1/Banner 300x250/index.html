!<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hallo Hi banners</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2 class="naam">Banner 300x250</h2>


    <div class="stage bannerSize banner-300x250">

        <div class="streepjes">
            <span></span>
            <span></span>
        </div>

        <div class="tekst">
            <div class="titel">
                <h1>Hallo,</h1>
                <div class="hi">Hi</div>
            </div>

            <h2>Internet + Bellen.</h2>

            <p class="subtitel">
                Sim Only abonnement
            </p>

            <ul class="voordelen">
                <li>+ Onbeperkt data</li>
                <li>+ 39,95/mnd</li>
                <li>+ Snelheid tot 1Gbit/s</li>
            </ul>
        </div>

        <!-- Simkaart afbeelding -->
        <img
            src="simKaart.png"
            class="simkaart"
            alt="Simkaart"
        >

        <!-- Bonus SUPERDEAL -->
        <div class="sticker">
            SUPERDEAL!
        </div>

        <div class="paars">
            <button>Ontdek meer</button>
        </div>

    </div>


    <h2 class="naam">Banner 300x600</h2>



</body>
</html>
